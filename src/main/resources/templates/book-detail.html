<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${book.title})}"></head>
<body>
<div class="site-shell">
    <nav th:replace="~{fragments/layout :: header('shop')}"></nav>

    <main class="page product-page">
        <div th:if="${success}" class="alert alert-ok" th:text="${success}" style="margin-bottom:1rem;"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}" style="margin-bottom:1rem;"></div>

        <nav class="store-breadcrumb" aria-label="Đường dẫn">
            <a th:href="@{/}">Trang chủ</a>
            <span class="store-breadcrumb-sep" aria-hidden="true">›</span>
            <a th:href="@{/shop}">Tất cả sản phẩm</a>
            <span class="store-breadcrumb-sep" aria-hidden="true">›</span>
            <span class="store-breadcrumb-current" th:text="${book.title}">Sách</span>
        </nav>

        <section class="product-layout">
            <div class="product-left">
                <div class="product-main-image">
                    <img th:if="${galleryImages != null and !#lists.isEmpty(galleryImages)}"
                         id="productMainImg"
                         th:src="@{${galleryImages[0]}}" th:alt="${book.title}"/>
                    <div th:unless="${galleryImages != null and !#lists.isEmpty(galleryImages)}"
                         class="product-no-image">Trí Tuệ</div>
                </div>

                <div class="product-thumbs"
                     th:if="${galleryImages != null and !#lists.isEmpty(galleryImages)}">
                    <button type="button"
                            class="product-thumb"
                            th:each="img, stat : ${galleryImages}"
                            th:classappend="${stat.index == 0} ? ' is-active'"
                            th:attr="data-src=@{${img}}"
                            aria-label="Xem ảnh">
                        <img th:src="@{${img}}" alt=""/>
                    </button>
                </div>

                <aside class="product-specs">
                    <h2>
                        <span class="specs-icon" aria-hidden="true">i</span>
                        Thông tin chi tiết
                    </h2>
                    <dl>
                        <div>
                            <dt>Mã sản phẩm</dt>
                            <dd th:text="'BK' + ${book.id}">BK1</dd>
                        </div>
                        <div>
                            <dt>Tác giả</dt>
                            <dd th:text="${book.author != null and !#strings.isEmpty(book.author) ? book.author : '—'}">—</dd>
                        </div>
                        <div>
                            <dt>Danh mục</dt>
                            <dd th:text="${book.category != null ? book.category.name : '—'}">—</dd>
                        </div>
                        <div>
                            <dt>Tồn kho</dt>
                            <dd th:text="${book.stockQuantity != null ? book.stockQuantity + ' cuốn' : '—'}">—</dd>
                        </div>
                        <div>
                            <dt>Giá bán</dt>
                            <dd th:text="${book.price != null ? #numbers.formatDecimal(book.price, 1, 'POINT', 0, 'COMMA') + ' ₫' : '—'}">—</dd>
                        </div>
                    </dl>
                </aside>
            </div>

            <div class="product-right">
                <h1 class="product-title" th:text="${book.title}">Tên sách</h1>
                <p class="product-submeta">
                    <span th:text="'BK' + ${book.id}">BK1</span>
                    <span class="sep">|</span>
                    <span th:with="stock=${book.stockQuantity != null ? book.stockQuantity : 0}">
                        <th:block th:if="${stock == 0}">Hết hàng</th:block>
                        <th:block th:unless="${stock == 0}">
                            Còn <strong th:text="${stock}">10</strong> cuốn
                        </th:block>
                    </span>
                </p>

                <div class="product-price-row">
                    <strong class="product-price"
                            th:text="${book.price != null ? #numbers.formatDecimal(book.price, 1, 'POINT', 0, 'COMMA') + ' ₫' : '—'}">
                        150.000 ₫
                    </strong>
                </div>

                <form th:if="${(currentUser == null or currentUser.role != 'ADMIN') and book.stockQuantity != null and book.stockQuantity > 0}"
                      th:action="@{/cart/add}" method="post" class="product-actions" id="productBuyForm">
                    <input type="hidden" name="bookId" th:value="${book.id}"/>
                    <input type="hidden" name="redirect" id="productRedirect"
                           th:value="${'/shop/books/' + book.id}"/>

                    <div class="product-qty" aria-label="Số lượng">
                        <button type="button" class="qty-btn" data-qty="-1" aria-label="Giảm">−</button>
                        <input id="quantity" type="number" name="quantity" value="1" min="1"
                               th:attr="max=${book.stockQuantity}" required/>
                        <button type="button" class="qty-btn" data-qty="1" aria-label="Tăng">+</button>
                    </div>

                    <div class="product-btns">
                        <button type="submit" class="btn btn-ghost product-btn-cart">
                            Thêm giỏ hàng
                        </button>
                        <button type="submit" class="btn btn-accent product-btn-buy"
                                th:attr="data-cart=@{/cart}">
                            Mua ngay
                        </button>
                    </div>
                </form>

                <p th:if="${book.stockQuantity == null or book.stockQuantity == 0}" class="muted product-note">
                    Sách hiện đã hết hàng.
                </p>
                <p th:if="${currentUser != null and currentUser.role == 'ADMIN'}" class="muted product-note">
                    Tài khoản admin không thêm giỏ hàng khách.
                </p>

                <div class="product-desc">
                    <h2>Mô tả sản phẩm</h2>
                    <p th:text="${book.description != null and !#strings.isEmpty(book.description) ? book.description : 'Chưa có mô tả chi tiết cho cuốn sách này.'}">
                        Mô tả
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>

<script>
(function () {
  var input = document.getElementById('quantity');
  if (input) {
    var min = parseInt(input.min || '1', 10);
    var max = parseInt(input.max || '99', 10);
    document.querySelectorAll('.qty-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var delta = parseInt(btn.getAttribute('data-qty'), 10);
        var next = parseInt(input.value || '1', 10) + delta;
        if (next < min) next = min;
        if (next > max) next = max;
        input.value = next;
      });
    });
  }

  var form = document.getElementById('productBuyForm');
  var redirect = document.getElementById('productRedirect');
  if (form && redirect) {
    var buyBtn = form.querySelector('.product-btn-buy');
    var cartBtn = form.querySelector('.product-btn-cart');
    var stayUrl = redirect.value;
    if (cartBtn) {
      cartBtn.addEventListener('click', function () {
        redirect.value = stayUrl;
      });
    }
    if (buyBtn) {
      buyBtn.addEventListener('click', function () {
        redirect.value = buyBtn.getAttribute('data-cart') || '/cart';
      });
    }
  }

  var mainImg = document.getElementById('productMainImg');
  if (mainImg) {
    document.querySelectorAll('.product-thumb').forEach(function (thumb) {
      thumb.addEventListener('click', function () {
        var src = thumb.getAttribute('data-src');
        if (!src) return;
        mainImg.src = src;
        document.querySelectorAll('.product-thumb').forEach(function (t) {
          t.classList.remove('is-active');
        });
        thumb.classList.add('is-active');
      });
    });
  }
})();
</script>
</body>
</html>
